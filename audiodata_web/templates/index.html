<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AUDIODATA - Buscador</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .buscador-container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 500px; 
            width: 100%; 
        }
        input[type="text"] { 
            padding: 12px; 
            width: 70%; 
            font-size: 16px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            margin-bottom: 15px;
        }
        button { 
            padding: 12px 25px; 
            font-size: 16px; 
            background-color: #1DB954; /* Verde tipo Spotify */
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background-color: #1aa34a; }
    </style>
</head>
<body>
    <div class="buscador-container">
        <h1>🎵 Sistema AUDIODATA</h1>
        <p>Introduce el nombre de un artista para integrar sus métricas desde Last.fm y Rate Your Music.</p>
        
        <form action="/buscar" method="POST">
            <input type="text" name="artista" placeholder="Ej: Queen, Rosalía, Daft Punk..." required>
            <br>
            <button type="submit">Buscar Artista</button>
        </form>
    </div>
</body>
</html>
